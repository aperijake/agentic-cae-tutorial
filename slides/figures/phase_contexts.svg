<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="Helvetica, Arial, sans-serif">
  <title>Separate contexts for each phase</title>
  <desc>A main agent dispatches four phases. Each has its own conversation and tools. The phases read and write shared state without exchanging chat histories.</desc>
  <rect width="1240" height="560" fill="white"/>
  <g fill="#d6e4f2" stroke="#6f8db0" stroke-width="2">
    <rect x="440" y="20" width="360" height="90" rx="8"/>
    <rect x="30" y="200" width="265" height="165" rx="8"/>
    <rect x="335" y="200" width="265" height="165" rx="8"/>
    <rect x="640" y="200" width="265" height="165" rx="8"/>
    <rect x="945" y="200" width="265" height="165" rx="8"/>
  </g>
  <g fill="none" stroke="#6f8db0" stroke-width="2">
    <path d="M620 110 V155 M162.5 155 H1077.5 M162.5 155 V200 M467.5 155 V200 M772.5 155 V200 M1077.5 155 V200"/>
  </g>
  <g text-anchor="middle" fill="#1f2937">
    <text x="620" y="56" font-size="28" font-weight="700">Main agent</text>
    <text x="620" y="88" font-size="23">Dispatches the work</text>
    <g font-size="27" font-weight="600">
      <text x="162.5" y="241">Geometry</text>
      <text x="467.5" y="241">Analysis setup</text>
      <text x="772.5" y="241">Mesh</text>
      <text x="1077.5" y="241">Solve</text>
    </g>
    <g font-size="24">
      <text x="162.5" y="290">Own conversation</text><text x="162.5" y="326">Own tools</text>
      <text x="467.5" y="290">Own conversation</text><text x="467.5" y="326">Own tools</text>
      <text x="772.5" y="290">Own conversation</text><text x="772.5" y="326">Own tools</text>
      <text x="1077.5" y="290">Own conversation</text><text x="1077.5" y="326">Own tools</text>
    </g>
  </g>
  <path d="M162.5 365 V420 M467.5 365 V420 M772.5 365 V420 M1077.5 365 V420" fill="none" stroke="#a69968" stroke-width="2"/>
  <rect x="30" y="420" width="1180" height="75" rx="8" fill="#fbf3d0" stroke="#a69968" stroke-width="2"/>
  <text x="620" y="467" text-anchor="middle" font-size="27" font-weight="600" fill="#1f2937">Shared state: decisions each phase reads and writes</text>
  <text x="620" y="540" text-anchor="middle" font-size="24" fill="#374151">Each phase starts fresh. Chat histories stay within their phase.</text>
</svg>
